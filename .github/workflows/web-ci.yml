name: Web CI

on:
  workflow_call:
    inputs:
      deploy:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - run: bun run web:lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - run: bun run web:type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - run: bun run web:test:unit
      - run: bun run web:build
      - run: bun run web:test:e2e

  build:
    if: inputs.deploy
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
      - run: bun run web:build-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
